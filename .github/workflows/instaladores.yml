# Compila los instaladores de iik para que los alumnos la usen sin instalar Python:
#   * Windows 10/11 (x64): iik-<versión>-windows-instalador.exe (Inno Setup, sin permisos de administrador)
#   * macOS 15+ con procesador Apple (M1, M2...): iik-<versión>-mac-apple-silicon.dmg
#
# Cuándo corre:
#   * Al publicar una etiqueta vX.Y.Z (git tag v0.1.0 && git push origin v0.1.0): crea un Release en GitHub
#     con los dos instaladores para descargar.
#   * En cada pull request que toque el empaquetado, y a mano desde la pestaña Actions («Run workflow»):
#     los instaladores quedan como artefactos de la corrida (Actions > la corrida > Artifacts).
name: Instaladores

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "instalador/**"
      - "requirements.txt"
      - ".github/workflows/instaladores.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (instalador .exe)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Versión
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(python -c 'import vientomx; print(vientomx.__version__)')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Empaquetar con PyInstaller
        run: pyinstaller instalador/iik.spec --noconfirm

      - name: Revisar el paquete (importaciones y datos)
        run: dist\iik\iik.exe --verificar

      - name: Revisar que la app arranca
        shell: pwsh
        run: |
          $env:IIK_SIN_NAVEGADOR = "1"
          $p = Start-Process -FilePath "dist\iik\iik.exe" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/_stcore/health" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          $html = (Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -UseBasicParsing).Content
          Stop-Process -Id $p.Id -Force
          if (-not $ok -or $html -notmatch "<div id=`"root`">") { Write-Error "iik no arrancó"; exit 1 }
          Write-Host "iik respondió en http://127.0.0.1:8765"

      - name: Armar instalador con Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          } else { $iscc = $iscc.Source }
          & $iscc "/DVersion=${{ steps.version.outputs.version }}" instalador\iik.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: iik-windows
          path: dist/iik-*-windows-instalador.exe
          if-no-files-found: error
          retention-days: 30

  mac:
    name: macOS Apple Silicon (.dmg)
    # arm64 (M1). macOS 15 porque rasterio y netCDF4 solo publican ruedas arm64 para macOS 15 o posterior.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Versión
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(python -c 'import vientomx; print(vientomx.__version__)')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Empaquetar con PyInstaller
        run: pyinstaller instalador/iik.spec --noconfirm

      - name: Corregir bibliotecas de PROJ y firmar
        run: |
          python instalador/arreglar_mac.py dist/iik.app
          codesign --force --deep --sign - dist/iik.app

      - name: Revisar el paquete (importaciones y datos)
        run: dist/iik.app/Contents/MacOS/iik --verificar

      - name: Revisar que la app arranca
        run: |
          IIK_SIN_NAVEGADOR=1 dist/iik.app/Contents/MacOS/iik &
          PID=$!
          ok=0
          for i in $(seq 1 90); do
            sleep 2
            if curl -sf http://127.0.0.1:8765/_stcore/health >/dev/null; then ok=1; break; fi
          done
          curl -sf http://127.0.0.1:8765/ | grep -q '<div id="root">' || ok=0
          kill $PID || true
          cat ~/.vientomx/iik-escritorio.log || true
          test $ok = 1

      - name: Armar .dmg
        run: bash instalador/hacer_dmg.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: iik-mac-apple-silicon
          path: dist/iik-*-mac-apple-silicon.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
          generate_release_notes: true
          body: |
            ## Descargar iik

            * **Windows 10/11:** `iik-…-windows-instalador.exe`. Si aparece «Windows protegió su PC», elija *Más información > Ejecutar de todas formas*.
            * **Mac con procesador M (M1, M2, M3…):** `iik-…-mac-apple-silicon.dmg`. Arrastre iik a Aplicaciones y siga el archivo *LEEME* del disco para abrirla la primera vez.

            iik se abre en el navegador. Para salir, use el botón «Cerrar iik» de la barra lateral.
