[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vientomx"
version = "0.1.0"
description = "Wind Resource Assessment (WRA) para centrales eólicas en México: datos de reanálisis, terreno, rugosidad, estelas y AEP P50/P90."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "requests>=2.28",
  "pyproj>=3.5",
  "rasterio>=1.3",
  "openpyxl>=3.1",
  "streamlit>=1.35",
  "plotly>=5.20",
  "folium>=0.15",
  "streamlit-folium>=0.20",
  "turbine-models>=0.2",
  "windpowerlib>=0.2.2",
]

[project.optional-dependencies]
era5 = ["cdsapi>=0.7", "xarray>=2023.1", "netCDF4>=1.6"]
dev = ["pytest>=7"]

[project.scripts]
vientomx = "vientomx.cli:main"

[tool.setuptools.packages.find]
include = ["vientomx*"]
